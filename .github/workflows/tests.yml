name: Tests
on:
  push:
  pull_request:
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pypdfium2==5.13.0 numpy Pillow
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: node --check static/rag.js
