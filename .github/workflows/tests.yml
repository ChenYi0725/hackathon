name: Tests
on:
  push:
  pull_request:
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install Traditional Chinese font for PDF tests
        run: sudo apt-get update && sudo apt-get install -y fonts-arphic-uming
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: node --check static/rag.js
